<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korax OS - Web Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>KORAX <span>OS</span></h1>
    <p>Interface Terminal & Centre de Commandes</p>
  </header>

  <main class="container">
    <!-- Section Dictionnaire des Commandes -->
    <section class="guide-section">
      <h2>Guide des Commandes</h2>
      <div class="command-list">
        <div class="card">
          <span class="cmd-name">apt update</span>
          <p>Mettre à jour les paquets du système Linux.</p>
        </div>
        <div class="card">
          <span class="cmd-name">apt install python3 -y</span>
          <p>Installer Python 3.</p>
        </div>
        <div class="card">
          <span class="cmd-name">apt install nodejs -y</span>
          <p>Installer Node.js pour exécuter des scripts JS.</p>
        </div>
      </div>
    </section>

    <!-- Section Terminal Interactif -->
    <section class="terminal-section">
      <div class="terminal-header">
        <span>CONSOLE INTERACTIVE</span>
      </div>
      
      <!-- Barre de touches virtuelles -->
      <div class="virtual-keyboard">
        <button onclick="pasteToTerminal()">📋 Coller</button>
        <button onclick="sendKey('\x0f')">CTRL+O (Sauvegarder)</button>
        <button onclick="sendKey('\x18')">CTRL+X (Quitter)</button>
        <button onclick="sendKey('\r')">↵ Entrée</button>
        <button onclick="sendKey('\x03')">CTRL+C</button>
        <button onclick="sendKey('\x09')">TAB</button>
        <button onclick="sendKey('\x1b')">ESC</button>
        <button onclick="sendKey('\x1b[A')">⬆️</button>
        <button onclick="sendKey('\x1b[B')">⬇️</button>
      </div>

      <!-- Cadre du Terminal relatif -->
      <div class="iframe-container">
        <iframe id="termFrame" src="/"></iframe>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
